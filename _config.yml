# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: De Novo
email: naturale0@snu.ac.kr
description: > # this means to ignore newlines until "baseurl:"
  A blog on Probability and Statistics.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site
twitter_username: naturale0
instagram_username: naturale0
github_username: naturale0

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# Third-party services
# just leave someone empty to disable it
google_analytics: 'UA-99089561-2'
disqus_url: http://disqus.com/by/naturale0
disqus_id: naturale0-github-io

# used this for post_excerpt at index_page
excerpt_separator: <!--description-->

exclude:
  - .jekyll-cache
  - vendor

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# sitemap
url: "https://naturale0.github.io"

# paginate
paginate: 5
paginate_path: "/page/:num"
defaults:
  -
    scope:
      path: "page"
    values:
      sitemap: false

# permalink
permalink: /:categories/:title

# SEO Tags
author: Sihyung Park
tagline: A blog on Probability and Statistics
twitter:
  username: naturale0
  card: summary_large_image
webmaster_verifications:
  google: 'tjq4lHXs2H8JUPh_QyKbr8Ozqb4NE5W8t60LImZcL48'
